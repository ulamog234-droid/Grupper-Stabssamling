// sortering på fornavn
participants.sort((a,b) => {
    const firstA = a.name.split(" ")[0];
    const firstB = b.name.split(" ")[0];
    return firstA.localeCompare(firstB, "no");
});

function displayPeople(list) {

    const results = document.getElementById("results");

    results.innerHTML = "";

    list.forEach(person => {

        results.innerHTML += `
            <div class="person">
                <strong>${person.name}</strong><br>
                <span class="group">Gruppe ${person.group}</span>
            </div>
        `;
    });
}

function searchNames() {

    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered = participants.filter(person =>
        person.name.toLowerCase().includes(search)
    );

    displayPeople(filtered);
}
